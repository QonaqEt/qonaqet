name: dependency-guard

# E00-T07. İki job:
#   guard              — öz skriptimiz: lock faylları + workflow action-ları allowlist-ə qarşı.
#                        Həmişə işləyir və "required check" olmaq üçün nəzərdə tutulub.
#   dependency-review  — actions/dependency-review-action: məlum CVE-lər və GPL/AGPL/SSPL lisenziyaları
#                        (keçid asılılıqları daxil).
#
# ⚠️ dependency-review private repoda GitHub Advanced Security (Code Security) tələb edir. Repo private
# və plan Free olduqca job açıq xəbərdarlıqla buraxılır (docs/github-setup.md → "Plan tələbi").

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Guard-ın öz testləri
        run: python3 -m unittest discover -s scripts/tests -p 'test_dependency_guard.py' -v

      - name: Lock faylları və action-lar allowlist-ə qarşı
        run: python3 scripts/ci/dependency-guard.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Plan dəstəyi
        id: support
        env:
          PRIVATE: ${{ github.event.repository.private }}
          HAS_CODE_SECURITY: ${{ vars.HAS_CODE_SECURITY }}
        run: |
          if [ "$PRIVATE" = "true" ] && [ "$HAS_CODE_SECURITY" != "true" ]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=dependency-review::Private repo — dependency review GitHub Code Security tələb edir. CVE/lisenziya yoxlaması BURAXILDI."
            {
              echo "## ⚠️ dependency-review buraxıldı"
              echo ""
              echo "Repo private-dir və Code Security aktiv deyil. Keçid asılılıqlarının CVE/lisenziya yoxlaması **işləmədi**."
              echo "Aktiv etdikdən sonra repo dəyişəni \`HAS_CODE_SECURITY=true\` təyin et."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependency review (CVE + lisenziya)
        if: steps.support.outputs.supported == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never
