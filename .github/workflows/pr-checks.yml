name: pr-checks

# E00-T09: PR iş prosesinə uyğundurmu (CLAUDE.md → "How Claude Code works")?
#   pr-checks — Conventional Commit başlığı, `Closes #n`, bağlanan issue `task`-dır və epic-in sub-issue-sudur
#   labeler   — dəyişən yollara görə `area:*` label-ları (.github/labeler.yml)
#
# `pull_request` (pull_request_target YOX): repo private-dir, fork PR-ları gözlənilmir; bu halda
# GITHUB_TOKEN label yaza bilir və yoxlama skriptinin PR-dakı versiyası işləyir. Skript və workflow
# CODEOWNERS ilə qorunur. `edited` — başlıq/body dəyişəndə yenidən yoxlanılır.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skriptin öz testləri
        run: python3 -m unittest discover -s scripts/tests -p 'test_pr_checks.py' -v

      # Başlıq və body yalnız env ilə ötürülür — `${{ }}` ilə skriptə yerləşdirilmir (injection).
      - name: Başlıq, Closes #n, task → epic
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/pr-checks.py

  labeler:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: area:* label-ları
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
