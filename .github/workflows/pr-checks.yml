name: pr-checks

# PR iş prosesinə uyğundurmu (CLAUDE.md → "How Claude Code works", ADR 0004)?
#   pr-checks — Conventional Commit başlığı, body-də `Task: Exx-Tnn`, task docs/epics-də mövcuddur,
#               epic PR müəllifinindir və main-də başqasına məxsus deyil
#   labeler   — dəyişən yollara görə `area:*` label-ları (.github/labeler.yml)
#
# GitHub issue/Project API-si işlədilmir: task-lar və sahiblik docs/epics/*.md-dədir.
# Başlıq və body skriptə yalnız env ilə ötürülür (injection yoxdur). `edited` — başlıq/body dəyişəndə
# yenidən yoxlanılır.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # base commit-dəki epic sahibliyini oxumaq üçün

      - name: Skriptin öz testləri
        run: python3 -m unittest discover -s scripts/tests -p 'test_pr_checks.py' -v

      - name: Başlıq, Task:, epic sahibliyi
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/pr-checks.py

  labeler:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: area:* label-ları
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
