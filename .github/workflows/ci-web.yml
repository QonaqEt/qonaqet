name: ci-web

# Veb CI (E00-T05): npm ci → lint → unit testlər → üç app-ın build-i → Playwright smoke.
#
# Workflow hər PR-da işə düşür, `web` job-u yalnız `web/**` (və ya bu fayl) dəyişəndə işləyir.
# Path filtri job səviyyəsindədir — buraxılan job "skipped" = uğurlu sayılır, required check ola bilər.
# Angular workspace E17-T01 ilə gəlir; o vaxta qədər job açıq xəbərdarlıqla yaşıl keçir.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  APPS: landing business-portal admin

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dəyişən yollar
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(web/|design-tokens/|\.github/workflows/ci-web\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workspace var?
        id: ws
        working-directory: .
        run: |
          if [ -f web/angular.json ] && [ -f web/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ci-web::web/angular.json hələ yoxdur (E17-T01) — npm ci, lint, test, build və e2e buraxıldı."
            {
              echo "## ⚠️ Veb yığılmadı"
              echo ""
              echo "Angular workspace hələ mövcud deyil (E17-T01). Bütün addımlar **buraxıldı**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Node
        if: steps.ws.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Design token-lər (CSS dəyişənləri)
        if: steps.ws.outputs.present == 'true'
        working-directory: design-tokens
        run: npm ci --no-audit --no-fund && npm run build

      - name: Asılılıqlar (lock fayldan)
        if: steps.ws.outputs.present == 'true'
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: steps.ws.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Unit testlər
        if: steps.ws.outputs.present == 'true'
        run: npm test --if-present -- --watch=false

      - name: Build — üç app
        if: steps.ws.outputs.present == 'true'
        run: |
          for app in $APPS; do
            echo "::group::ng build $app"
            npx ng build "$app"
            echo "::endgroup::"
          done

      - name: Playwright brauzeri
        if: steps.ws.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        if: steps.ws.outputs.present == 'true'
        run: npx playwright test --trace off

      - name: Playwright hesabatı (artefakt)
        if: ${{ failure() && steps.ws.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
