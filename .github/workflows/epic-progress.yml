name: epic-progress

# `docs/epics/Exx.md`-də `status: done` olan hər epic üçün `epic-Exx-done` tag-ı (ADR 0004).
# İdempotentdir: mövcud tag-a toxunulmur. GITHUB_TOKEN kifayətdir.

on:
  push:
    branches: [main]
    paths: ["docs/epics/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epic-progress
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # epic-Exx-done tag-ı
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bitmiş epic-lərə tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 scripts/ci/epic-progress.py
