name: ci-infra

# Dev docker-compose stack-inin yoxlanması (E00-T02) və repo skriptlərinin/konfiqurasiyasının testləri.
#
# Workflow hər PR-da işə düşür, amma ağır job yalnız `deploy/**` dəyişəndə işləyir.
# Path filtri trigger səviyyəsində (`on.pull_request.paths`) DEYİL, job səviyyəsindədir:
# trigger səviyyəsində süzülən workflow heç bir status vermir və ruleset-də "required check"
# kimi PR-ı əbədi gözlədir; `if` ilə buraxılan job isə "skipped" = uğurlu sayılır.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dəyişən yollar
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(deploy/|\.github/workflows/ci-infra\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(scripts/|\.github/|docs/epics/)'; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=false" >> "$GITHUB_OUTPUT"
          fi

  compose:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Statik yoxlamalar (pin, healthcheck, portlar, .env.example)
        run: python3 -m unittest discover -s deploy/tests -v

      - name: Smoke — stack qalxır, tranzaksiya və bucket versioning-i işləyir
        run: deploy/tests/smoke.sh

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Epic sənədləri parse olunur
        run: python3 scripts/lib/parse-epics.py docs/epics > /dev/null

      - name: Skript və repo konfiqurasiyası testləri
        run: python3 -m unittest discover -s scripts/tests -v
