name: codeql

# E00-T08: CodeQL — C# və JavaScript/TypeScript; hər PR-da, main-ə push-da və həftəlik.
#
# ⚠️ Code scanning private repoda GitHub Code Security tələb edir. Repo private və Code Security
# aktiv deyilsə (repo dəyişəni HAS_CODE_SECURITY != 'true'), analiz açıq xəbərdarlıqla buraxılır.
# Dili olmayan (hələ mənbə kodu yazılmamış) analiz də xəbərdarlıqla buraxılır — CodeQL boş
# layihədə xəta verir.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # bazar ertəsi 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            sources: backend
            pattern: "*.cs"
          - language: javascript-typescript
            sources: web
            pattern: "*.ts"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analiz mümkündürmü?
        id: gate
        env:
          PRIVATE: ${{ github.event.repository.private }}
          HAS_CODE_SECURITY: ${{ vars.HAS_CODE_SECURITY }}
          LANGUAGE: ${{ matrix.language }}
          SOURCES: ${{ matrix.sources }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          reason=""
          if [ "$PRIVATE" = "true" ] && [ "$HAS_CODE_SECURITY" != "true" ]; then
            reason="private repo, Code Security aktiv deyil (HAS_CODE_SECURITY != true)"
          elif [ -z "$(git ls-files "$SOURCES/$PATTERN" | head -1)" ]; then
            reason="$SOURCES/ altında hələ $PATTERN mənbə faylı yoxdur"
          fi
          if [ -n "$reason" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=codeql ($LANGUAGE)::Analiz BURAXILDI — $reason."
            echo "## ⚠️ CodeQL ($LANGUAGE) buraxıldı — $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CodeQL init
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: CodeQL analiz
        if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
