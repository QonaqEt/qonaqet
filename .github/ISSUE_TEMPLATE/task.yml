name: Task
description: Bir PR ilə bağlanan konkret iş; mütləq bir epic-ə aid olur
title: "[E__-T__] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        **Hər task bir epic-ə aid olmalıdır.** Valideyn epic-i göstərməyən task bağlanmır (`pr-checks`).
  - type: input
    id: parent-epic
    attributes:
      label: Valideyn epic
      description: Epic issue-nun nömrəsi
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Nə və niyə. `CLAUDE.md`-dəki aid bölməyə istinad et.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: test-notes
    attributes:
      label: Test qeydləri
      description: Hansı testlər yazılır; hansı sərhəd halları yoxlanılır
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - integration
        - mobile
        - web-landing
        - web-business
        - web-admin
        - infra
        - design
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["p0", "p1", "p2"]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["XS", "S", "M", "L"]
    validations:
      required: true
