name: secure_store
description: "QONAQET öz plugin-i: həssas dəyərlər iOS Keychain və Android Keystore-da (E14-T05)."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: az.qonaqet.secure_store
        pluginClass: SecureStorePlugin
      ios:
        pluginClass: SecureStorePlugin
